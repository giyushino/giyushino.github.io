<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- GitHub Pages serves static files only, so there's no server-side 301 to
       be had. Meta refresh covers no-JS, location.replace keeps the redirect
       out of the back-button history, and the link is the manual fallback. -->
  <link rel="canonical" href="https://youtu.be/U2Bq75FlsoA">
  <meta http-equiv="refresh" content="0; url=https://youtu.be/U2Bq75FlsoA">
  <script>location.replace("https://youtu.be/U2Bq75FlsoA")</script>
</head>
<body>
  <p>Redirecting to <a href="https://youtu.be/U2Bq75FlsoA">the video</a>…</p>
</body>
</html>
